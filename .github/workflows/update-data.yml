name: Update BUIS course data
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run update:data
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/courses.json data/metadata.json
          git diff --cached --quiet || git commit -m "data: refresh BUIS catalogue"
          git push
